name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Entpacke ZIP falls vorhanden
        shell: pwsh
        run: |
          Get-ChildItem -Filter "*.zip" | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath "extracted" -Force
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse -Filter "email_aufraeumen.py" | Select-Object -First 1
          pyinstaller --onefile --noconsole --name EmailAufraeumen $file.FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EmailAufraeumen-exe
          path: dist/EmailAufraeumen.exe
